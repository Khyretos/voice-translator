# Nightly lint fixes as small pull requests. Runs on kompas-builder or windows-wsl.
# Copy to .forgejo/workflows/lint-fix.yml; same flavour image as lint.yml.
# Each night lint_nightly.py (khyretos/kompas-ci) picks ONE linter and up to 8 of its
# files, runs the linter's own fix mode, then lets Qwen 3.5 on soucouyant fix the rest
# file by file. A change is kept only when the error count of that language goes down.
# Result: PR "lint-fix/<linter>". At most 3 such PRs wait at a time; after a merge the
# next night continues. The PR is opened and pushed as the review bot (user secret
# LINT_PR_TOKEN), so its checks start and the auto-merge bot merges it once they pass.
name: lint-fix
enable-email-notifications: true
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"   # nightly 02:30

jobs:
  fix:
    runs-on: ubuntu-latest
    container:
      image: oxsecurity/megalinter-python:v9
    env:
      # Ollama on soucouyant through the relay on kireserver (a LAN address, so either runner reaches it)
      OLLAMA_URL: http://192.168.178.103:11435/v1/chat/completions
      CI_RAW: ${{ github.server_url }}/khyretos/kompas-ci/raw/branch/main
      DEFAULT_WORKSPACE: ${{ github.workspace }}
      EXTENDS: ${{ github.server_url }}/khyretos/kompas-ci/raw/branch/main/mega-linter.base.yml
      CONFIG_PROPERTIES_TO_APPEND: DISABLE_LINTERS
      TOKEN: ${{ secrets.LINT_PR_TOKEN || github.token }}
      API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
      BASE: ${{ github.ref_name }}
    steps:
      - name: Check out (plain git, push access)
        run: |
          git init -q . && git config core.autocrlf false   # the image sets autocrlf=true: whole-file CRLF diffs
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git config http.extraHeader "Authorization: token ${{ secrets.LINT_PR_TOKEN || github.token }}"
          git fetch -q origin "$BASE" && git checkout -q -B lint-fix-work FETCH_HEAD
          git config user.name "kompas-lint" && git config user.email "lint@kreative-kompas.com"
          curl -sf "$CI_RAW/lint_setup.sh" | sh
          for f in lint_nightly.py lint_ai_fix.py keep_eol.py; do curl -sf "$CI_RAW/$f" -o "/tmp/$f"; done
      - name: Fix one linter and open a PR
        run: python3 /tmp/lint_nightly.py
