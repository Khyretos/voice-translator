# MegaLinter (AGPL-3.0): ~100 linters and security scanners in one step, run on
# soucouyant. Free alternative to SonarQube. Copy to .forgejo/workflows/lint.yml
# and pick the flavour image for the repo's main language:
#   megalinter-python, -javascript (TS/Angular/React), -java, -cupcake (C/C++ and
#   most others), -go, -rust, or megalinter (everything, ~10 GB).
# Results: one readable summary comment on the PR (updated on every push) plus the
# full logs in the job. Scripts: public repo khyretos/kompas-ci (lint_summary.py).
# Shared settings and rule files: mega-linter.base.yml and linters/ in kompas-ci.
# Fine-tune per repo with a .mega-linter.yml (its DISABLE_LINTERS adds to the shared list).
name: lint
enable-email-notifications: true
on:
  pull_request:
  push:
    branches: [main]

jobs:
  megalinter:
    runs-on: soucouyant
    container:
      image: oxsecurity/megalinter-python:v9
    steps:
      - name: Check out (plain git)
        run: |
          git init -q . && git config core.autocrlf false && git -c http.extraHeader="Authorization: token ${{ github.token }}" fetch -q "${{ github.server_url }}/${{ github.repository }}" "${{ github.sha }}" && git checkout -q FETCH_HEAD
          curl -sf "${{ github.server_url }}/khyretos/kompas-ci/raw/branch/main/lint_setup.sh" | sh
      - name: MegaLinter
        env:
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          VALIDATE_ALL_CODEBASE: "true"
          EXTENDS: ${{ github.server_url }}/khyretos/kompas-ci/raw/branch/main/mega-linter.base.yml
          CONFIG_PROPERTIES_TO_APPEND: DISABLE_LINTERS
          APPLY_FIXES: none
          DISABLE_ERRORS: "true"    # report only; set to "false" to fail the check on errors
          SHOW_ELAPSED_TIME: "true"
          FILEIO_REPORTER: "false"
          JSON_REPORTER: "true"          # read by the summary step
          MARKDOWN_SUMMARY_REPORTER: "false"
        run: /entrypoint.sh
      - name: Post a readable summary on the PR (updates its own earlier comment)
        if: always() && github.event_name == 'pull_request'
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          curl -sf "${{ github.server_url }}/khyretos/kompas-ci/raw/branch/main/lint_summary.py" -o /tmp/lint_summary.py
          python3 /tmp/lint_summary.py > /tmp/summary.md || echo "MegaLinter produced no report; see the Actions log." > /tmp/summary.md
          python3 - <<'PY'
          import json, os, urllib.request
          api, h = os.environ["API"], {"Content-Type": "application/json", "Authorization": "token " + os.environ["TOKEN"]}
          body = "<!-- kk-lint -->\n" + open("/tmp/summary.md").read()[:60000]
          call = lambda m, u, d=None: json.load(urllib.request.urlopen(urllib.request.Request(u, json.dumps(d).encode() if d else None, h, method=m)))
          mine = [c for c in call("GET", f"{api}/issues/{os.environ['PR']}/comments") if c["body"].startswith("<!-- kk-lint -->")]
          if mine:
              call("PATCH", f"{api}/issues/comments/{mine[-1]['id']}", {"body": body})
          else:
              call("POST", f"{api}/issues/{os.environ['PR']}/comments", {"body": body})
          PY
